databaseChangeLog:
  - changeSet:
      id: 1
      author: Cristovan Tamayo
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: NUMBER(19,0)
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_orders
              - column:
                  name: event_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: customer_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: total_amount
                  type: DECIMAL(19, 2)
              - column:
                  name: order_status
                  type: VARCHAR(50)
              - column:
                  name: created_at
                  type: DATETIME