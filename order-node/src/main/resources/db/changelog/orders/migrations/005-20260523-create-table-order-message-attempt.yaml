databaseChangeLog:
  - changeSet:
      id: 20260523-create-table-order-message-attempt-v2
      author: Cristovan Tamayo
      objectQuotingStrategy: LEGACY
      changes:
        - createTable:
            schemaName: APP_ORDER
            tableName: ORDER_MESSAGE_ATTEMPT
            columns:
              - column:
                  name: ID
                  type: VARCHAR2(36)
                  constraints:
                    primaryKey: true
                    primaryKeyName: PK_ORDER_MESSAGE_ATTEMPT
                    nullable: false
              - column:
                  name: ORDER_ID
                  type: VARCHAR2(36)
                  constraints:
                    nullable: false
              - column:
                  name: CORRELATION_ID
                  type: VARCHAR2(100)
                  constraints:
                    nullable: false
              - column:
                  name: EVENT_TYPE
                  type: VARCHAR2(100)
                  constraints:
                    nullable: false
              - column:
                  name: ROUTING_KEY
                  type: VARCHAR2(150)
                  constraints:
                    nullable: false
              - column:
                  name: STATUS
                  type: VARCHAR2(30)
                  defaultValue: 'PENDING'
                  constraints:
                    nullable: false
              - column:
                  name: ERROR_MESSAGE
                  type: VARCHAR2(1000)
              - column:
                  name: CREATED_AT
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: UPDATED_AT
                  type: TIMESTAMP
